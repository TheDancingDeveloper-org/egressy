name: Container images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One in-flight run per ref. Three pushes in 40 minutes previously left
# three builds running concurrently, occupying every Docker-capable runner
# while everything else queued behind them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # publish, not docker: node-b-gha-public-rust advertises `docker` but has
    # no DinD sidecar, so a container build can land on a worker with no
    # Docker daemon. Only the publish pair is backed by a real daemon.
    runs-on: [self-hosted, publish]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Registry refs must be lowercase; github.repository keeps the org's case.
      - name: Lowercase image repository
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # The `build` check is required on main, so it must report on every
      # pull request, including docs-only ones. Detect docs-only changes here
      # and skip only the expensive image steps below.
      - name: Detect docs-only change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|AGENTS.md|CONTRIBUTING.md|SECURITY.md) ;;
              *) docs_only=false; break ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only change: $docs_only"
      - uses: docker/setup-qemu-action@v4
        if: steps.scope.outputs.docs_only != 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.scope.outputs.docs_only != 'true'
      - uses: docker/login-action@v4
        if: steps.scope.outputs.docs_only != 'true' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Gateway image metadata
        id: gateway
        uses: docker/metadata-action@v6
        if: steps.scope.outputs.docs_only != 'true'
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build gateway image
        uses: docker/build-push-action@v7
        if: steps.scope.outputs.docs_only != 'true'
        with:
          context: .
          # arm64 is emulated through QEMU and is roughly an order of magnitude
          # slower than a native build. Doing it on every push to main cost 80+
          # minutes per run and starved the whole fleet; it is only needed on
          # what we actually ship, so it is restricted to tags.
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.gateway.outputs.tags }}
          labels: ${{ steps.gateway.outputs.labels }}
          # Registry-backed cache, not type=gha: the GHA cache export is what
          # wedged during finalization on the self-hosted BuildKit path, and a
          # local cache would not survive job-completed.sh wiping the
          # workspace after every job. Writing needs registry auth, so both
          # directions are gated on the same condition as the login step.
          cache-from: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}:buildcache', env.IMAGE_REPO) || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}:buildcache,mode=max', env.IMAGE_REPO) || '' }}
      - name: External validator image metadata
        id: validator
        uses: docker/metadata-action@v6
        if: steps.scope.outputs.docs_only != 'true'
        with:
          images: ghcr.io/${{ github.repository }}-external-probe
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build external validator image
        uses: docker/build-push-action@v7
        if: steps.scope.outputs.docs_only != 'true'
        with:
          context: external-probe
          # arm64 is emulated through QEMU and is roughly an order of magnitude
          # slower than a native build. Doing it on every push to main cost 80+
          # minutes per run and starved the whole fleet; it is only needed on
          # what we actually ship, so it is restricted to tags.
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.validator.outputs.tags }}
          labels: ${{ steps.validator.outputs.labels }}
          # Registry-backed cache, not type=gha: the GHA cache export is what
          # wedged during finalization on the self-hosted BuildKit path, and a
          # local cache would not survive job-completed.sh wiping the
          # workspace after every job. Writing needs registry auth, so both
          # directions are gated on the same condition as the login step.
          cache-from: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}-external-probe:buildcache', env.IMAGE_REPO) || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}-external-probe:buildcache,mode=max', env.IMAGE_REPO) || '' }}
