name: Migration policy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per ref. Three pushes in 40 minutes previously left
# three builds running concurrently, occupying every Docker-capable runner
# while everything else queued behind them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: [self-hosted, node-b, linux, x64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify migration policies
        shell: bash
        run: bash ci/migration-policy.sh
