# Overlay for network.ipv6.enabled: docker compose -f compose.yaml -f compose.ipv6.yaml up -d
# Requires a vpn-egress network created with EGRESSY_IPV6=1 config/docker-network.sh.
services:
  egressy:
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
    networks:
      vpn-egress:
        ipv4_address: 172.30.0.2
        ipv6_address: fd30:172:30::2
