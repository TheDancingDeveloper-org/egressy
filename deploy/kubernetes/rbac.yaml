# Read-only pod access for Egressy's Kubernetes discovery (docs/KUBERNETES.md).
# Egressy only lists pods on its own node; it never writes to the cluster.
# Example only: adjust the namespace to wherever the credential is issued.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: egressy-discovery
  namespace: egressy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: egressy-pod-discovery
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: egressy-pod-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: egressy-pod-discovery
subjects:
  - kind: ServiceAccount
    name: egressy-discovery
    namespace: egressy
---
# A long-lived token for a gateway that runs outside the cluster (on Docker).
# In-cluster deployments use the projected service-account token instead.
apiVersion: v1
kind: Secret
metadata:
  name: egressy-discovery-token
  namespace: egressy
  annotations:
    kubernetes.io/service-account.name: egressy-discovery
type: kubernetes.io/service-account-token
